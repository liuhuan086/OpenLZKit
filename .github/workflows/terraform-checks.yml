name: terraform-checks

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false
      - name: Validate every module and live stack
        shell: bash
        run: |
          set -euo pipefail
          # Auto-discover every directory containing Terraform files. Backend is
          # disabled so no cloud credentials are needed; this is the static gate.
          while IFS= read -r dir; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done < <(find multi-cloud -type f -name '*.tf' -exec dirname {} \; | sort -u)

  policy:
    name: conftest policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          set -euo pipefail
          ver=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${ver}/conftest_${ver}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version
      - name: Verify policy unit tests
        run: conftest verify --policy multi-cloud/alicloud/policies

  # TODO: add lint (tflint) and security scan (checkov/tfsec) jobs as those
  # toolchains are introduced.
