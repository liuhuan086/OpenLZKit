name: terraform-checks

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  static-release:
    name: static release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation and demo artifacts
        run: python tools/static_release_gate.py

  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.2"
          terraform_wrapper: false
      - name: Validate every module and live stack
        shell: bash
        run: |
          set -euo pipefail
          # Auto-discover every directory containing Terraform files. Backend is
          # disabled so no cloud credentials are needed; this is the static gate.
          while IFS= read -r dir; do
            echo "::group::validate ${dir}"
            terraform -chdir="${dir}" init -backend=false -no-color
            terraform -chdir="${dir}" validate -no-color
            echo "::endgroup::"
          done < <(find multi-cloud -type f -name '*.tf' -exec dirname {} \; | sort -u)

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: Init plugins
        run: tflint --init
      - name: Run tflint (recursive)
        run: tflint --recursive --format compact

  security:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: multi-cloud
          config_file: .checkov.yaml
          skip_download: true

  policy:
    name: conftest policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          set -euo pipefail
          ver=0.56.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${ver}/conftest_${ver}_Linux_x86_64.tar.gz" \
            | tar -xz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version
      - name: Verify policy unit tests
        shell: bash
        run: |
          set -euo pipefail
          # Auto-discover every policy dir that actually contains Rego, so all
          # implemented clouds are gated while empty placeholder dirs are skipped.
          while IFS= read -r pol; do
            echo "::group::conftest verify ${pol}"
            conftest verify --policy "${pol}"
            echo "::endgroup::"
          done < <(find multi-cloud -name '*.rego' -exec dirname {} \; | sort -u)
