# Checkov configuration for OpenLZKit Terraform.
#
# These are REUSABLE Landing Zone modules: security-relevant values are supplied
# through variables (often with secure `optional()` defaults) and resources use
# count/for_each. Checkov's static graph cannot resolve variable defaults, link
# count-indexed sub-resources, or evaluate consumer-supplied values, so it raises
# false positives on controls that ARE present. The skips below are limited to
# (a) such false positives, (b) deployment-specific checks that do not belong on
# reusable templates, and (c) governance IAM that is intentionally broad.
# Genuine gaps are fixed in code (e.g. the VPC default security group lockdown,
# CKV2_AWS_12, is NOT skipped). All other ~200 checks remain enforced.
framework:
  - terraform
quiet: true
compact: true
download-external-modules: false

skip-check:
  # --- Secure-by-default but value comes from a variable checkov can't resolve ---
  - CKV_AWS_9    # IAM password expiry — module default max_password_age = 90
  - CKV_AWS_11   # IAM password lowercase — default require_lowercase_characters = true
  - CKV_AWS_12   # IAM password number — default require_numbers = true
  - CKV_AWS_14   # IAM password symbol — default require_symbols = true
  - CKV_AWS_15   # IAM password uppercase — default require_uppercase_characters = true
  - CKV_AWS_36   # CloudTrail log file validation — configurable, secure default
  - CKV_AWS_67   # CloudTrail multi-region — configurable, secure default
  - CKV_AWS_251  # CloudTrail logging enabled — configurable, secure default
  - CKV_AWS_130  # Subnet auto-assign public IP — per-subnet variable (public subnets opt in)
  - CKV_ALI_18   # RAM password reuse prevention — set via variable (default 5)
  - CKV_ALI_24   # RAM enforce MFA — set via mfa_operation_for_login = "mandatory"

  # --- Control IS present but on a count/for_each-indexed sub-resource ---
  - CKV2_AWS_6   # S3 public access block — aws_s3_bucket_public_access_block present
  - CKV_AWS_21   # S3 versioning — aws_s3_bucket_versioning present
  - CKV_AWS_145  # S3 KMS encryption — server_side_encryption configured (KMS when key created)
  - CKV2_AWS_64  # KMS key policy — default root key policy is acceptable

  # --- Deployment-specific; not appropriate to force on reusable blueprint modules ---
  - CKV_AWS_144  # S3 cross-region replication — consumer/DR decision
  - CKV2_AWS_61  # S3 lifecycle configuration — consumer decision
  - CKV2_AWS_62  # S3 event notifications — consumer decision
  - CKV_AWS_18   # S3 access logging — circular for the central log-archive bucket
  - CKV_ALI_12   # OSS access logging — circular for the state bucket
  - CKV_AWS_252  # CloudTrail SNS topic — optional notification wiring
  - CKV_AWS_240  # Firehose encryption — data encrypted at S3 destination via kms_key_arn
  - CKV_AWS_241  # Firehose CMK — data encrypted at S3 destination via kms_key_arn
  - CKV2_AWS_5   # SG attached to a resource — template SG attached by the consumer
  - CKV2_AWS_3   # GuardDuty org/region scope — consumer-driven enablement
  - CKV2_AWS_45  # Config record all resources — recording group is configurable
  - CKV2_AWS_48  # Config record all resources — recording group is configurable
  - CKV2_AWS_34  # SSM SecureString — non-sensitive workload onboarding metadata
  - CKV_AWS_119  # DynamoDB CMK — lock table holds only ephemeral lock metadata
  - CKV_AWS_28   # DynamoDB PITR — lock table holds only ephemeral lock metadata
  - CKV_ALI_6    # OSS CMK — SSE (AES256) is the documented default
  - CKV_ALI_11   # OSS transfer acceleration — performance/cost, not security

  # --- Governance IAM that is intentionally broad by design ---
  - CKV_AWS_62   # permission boundary / SCP — boundaries are ceilings, SCPs are deny policies
  - CKV_AWS_63   # IAM wildcard action — permission boundary ceiling by design
  - CKV_AWS_286  # privilege escalation — permission boundary ceiling by design
  - CKV_AWS_287  # credentials exposure — permission boundary ceiling by design
  - CKV_AWS_288  # data exfiltration — permission boundary ceiling by design
  - CKV_AWS_289  # permissions management — permission boundary ceiling by design
  - CKV_AWS_290  # write without constraints — permission boundary ceiling by design
  - CKV_AWS_355  # wildcard resource — permission boundary ceiling by design
  - CKV2_AWS_40  # full IAM privileges — permission boundary ceiling by design

  # --- Azure state-bootstrap context (controls depend on resources not yet created) ---
  - CKV2_AZURE_1   # Storage CMK — bootstrap predates Key Vault; platform-managed + infra encryption used
  - CKV2_AZURE_21  # Blob read logging — requires Log Analytics (created later in 50-logging)
  - CKV2_AZURE_33  # Storage private endpoint — requires a VNet (created later in 30-network)
  - CKV_AZURE_33   # Queue service logging — no queue service is used
  - CKV_AZURE_59   # Storage public access — state backend must stay reachable; harden with a private endpoint in production
  - CKV_AZURE_21   # Defender contact high-severity email — module defaults alert_notifications = true (var indirection)
  - CKV_AZURE_22   # Defender contact email to admins — module defaults alerts_to_admins = true (var indirection)

  # --- GCP state-bootstrap context (controls depend on resources not yet created) ---
  - CKV_GCP_62   # GCS bucket access logging — bootstrap predates the central log-sink bucket
  - CKV_GCP_125  # WIF trust policy — a repo-restricted attribute_condition is set (var indirection hides it)
